<!doctype html>
  <html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ページ6（単独ページ）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      @page { 
        size: A4 landscape; 
        margin: 14mm; 
      }
      body { 
        font-family: 'Noto Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; 
        color: #111; 
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        
      }
      h1 { font-size: 28px; margin: 0 0 12px; font-weight: 500; }
      p { line-height: 1.8; margin: 0 0 16px; }
      .timestamp { 
        font-size: 12px; 
        color: #666; 
        text-align: right; 
        margin-bottom: 20px; 
        border-bottom: 1px solid #eee; 
        padding-bottom: 10px; 
      }
      h2 { font-size: 24px; margin: 20px 0 12px; font-weight: 500; color: #333; }
      h3 { font-size: 18px; margin: 16px 0 8px; font-weight: 500; color: #444; }
      .section { margin: 20px 0; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
      .image-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 20px; }
      figure { margin: 0; }
      figcaption { font-size: 12px; color: #555; margin-top: 8px; text-align: center; }
      img { 
        width: 100%; 
        height: auto; 
        border: 1px solid #ddd; 
        border-radius: 4px;
        max-height: 300px;
        object-fit: cover;
      }
      .timeline-table { 
        width: 100%; 
        border-collapse: collapse; 
        margin-top: 20px; 
        font-size: 14px;
      }
      .timeline-table th, .timeline-table td { 
        border: 1px solid #ddd; 
        padding: 8px 12px; 
        text-align: left; 
      }
      .timeline-table th { 
        background-color: #f5f5f5; 
        font-weight: 500; 
      }
      .timeline-table td:first-child { 
        width: 80px; 
        text-align: center; 
        font-weight: 500; 
      }
      .timeline-table td:nth-child(2) { 
        width: 60px; 
        text-align: center; 
      }
      .page { break-after: page; }
      
      /* 見開きモード用のスタイル */
      
    </style>
  </head>
  <body>
    
    <section class="page">
      <div class="timestamp">最終更新: 2025-09-27 15:04:57</div>
      <h1>ページ6（単独ページ）</h1>
      
        <h2>これは6ページ目です</h2>
        <p>隣接ページ（7ページ）が存在しない場合のテストです。</p>
      
    </section>
    
  </body>
  </html>
