name: Generate PDF Booklets

on:
  workflow_dispatch:
    inputs:
      wp_post_ids:
        description: 'WordPress ページ/投稿ID（カンマ区切り: 123,456,789）'
        required: true
      target_slug:
        description: 'ターゲットとなるページIDまたはスラッグ（任意）'
        required: false
        default: ''
      template_type:
        description: 'テンプレートタイプ（空なら自動判定）'
        required: false
        default: ''
      concurrency:
        description: 'PDF 同時生成数（Vivliostyle安定のため 2〜3 推奨）'
        required: false
        default: '2'
      skip_schema:
        description: 'スキーマ検証をスキップ（1/true でスキップ）'
        required: false
        default: '0'
      allow_dummy:
        description: 'ダミーデータ生成を許可（1/true で許可）'
        required: false
        default: '0'
      spread_mode:
        description: '見開き表示モード（true で見開きPDF生成）'
        required: false
        default: 'false'
      output_suffix:
        description: '出力ファイル名のサフィックス（見開きPDFの場合は -spread）'
        required: false
        default: ''

# 並行実行制御: 同じページIDでの同時実行を防ぐ（見開きモード考慮）
concurrency:
  group: pdf-generation-${{ github.event.inputs.wp_post_ids }}-${{ github.event.inputs.spread_mode || 'normal' }}
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_PASS: ${{ secrets.WP_PASS }}
      WP_JWT: ${{ secrets.WP_JWT }}
      WP_BASIC_USER: ${{ secrets.WP_BASIC_USER }}
      WP_BASIC_PASS: ${{ secrets.WP_BASIC_PASS }}
      ON_ERROR: "continue"
      CONCURRENCY: ${{ github.event.inputs.concurrency }}
      TEMPLATE_TYPE: ${{ github.event.inputs.template_type }}
      SKIP_SCHEMA: ${{ github.event.inputs.skip_schema }}
      TARGET_SLUG: ${{ github.event.inputs.target_slug }}
      WEBHOOK: ${{ secrets.WP_WEBHOOK_URL }}
      ALLOW_DUMMY: ${{ github.event.inputs.allow_dummy }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DESTINATION_PATH: ${{ secrets.FTP_DESTINATION_PATH }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
      SPREAD_MODE: ${{ github.event.inputs.spread_mode }}
      OUTPUT_SUFFIX: ${{ github.event.inputs.output_suffix }}

    steps:
    
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Setup isolated workspace
        run: |
          echo "🏗️ Setting up isolated workspace for run ${{ github.run_id }}"
          
          # 実行ごとに独立したディレクトリを作成
          WORK_DIR="work-${{ github.run_id }}"
          mkdir -p "$WORK_DIR"/{out,deploy,scripts}
          
          # 必要なスクリプトファイルをコピー
          cp scripts/build-one.js "$WORK_DIR/scripts/"
          cp scripts/build-batch.js "$WORK_DIR/scripts/"
          cp scripts/fetch-acf.js "$WORK_DIR/scripts/"
          cp package.json "$WORK_DIR/" 2>/dev/null || echo "package.json not found, skipping"
          
          # 環境変数として設定
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          echo "OUT_DIR=$WORK_DIR/out" >> "$GITHUB_ENV"
          echo "DEPLOY_DIR=$WORK_DIR/deploy" >> "$GITHUB_ENV"
          
          echo "✅ Workspace created: $WORK_DIR"
          echo "✅ Scripts copied to: $WORK_DIR/scripts/"
          
          # デバッグ: ワークスペースの内容確認
          echo "📁 Workspace contents:"
          ls -la "$WORK_DIR"
          echo "📁 Scripts directory:"
          ls -la "$WORK_DIR/scripts"

      - name: Fetch ACF (public first)
        env:
          WP_URL: ${{ env.WP_URL }}
          WP_PAGE_IDS: ${{ github.event.inputs.wp_post_ids }}
          # 認証情報を必要に応じて渡す（公開ページなら不要、非公開なら必要）
          WP_JWT: ${{ env.WP_JWT }}
          WP_BASIC_USER: ${{ env.WP_BASIC_USER }}
          WP_BASIC_PASS: ${{ env.WP_BASIC_PASS }}
          # ダミーデータ生成を無効化（実際のデータのみ使用）
          ALLOW_DUMMY: 0
        run: |
          set -euo pipefail
          echo "🔎 Fetch ACF for: $WP_PAGE_IDS"
          echo "🌐 WordPress URL: $WP_URL"
          echo "🎛️ ALLOW_DUMMY: ${ALLOW_DUMMY:-0}"
          echo "📖 SPREAD_MODE: ${SPREAD_MODE:-false}"
          echo "📝 OUTPUT_SUFFIX: ${OUTPUT_SUFFIX:-}"
          echo "🏗️ Workspace directory: $WORK_DIR"
          echo "📁 Current directory: $(pwd)"
          
          # 必須パラメータの確認
          if [ -z "${WP_URL:-}" ]; then
            echo "❌ ERROR: WP_URL is not set!"
            exit 1
          fi
          
          if [ -z "${WP_PAGE_IDS:-}" ]; then
            echo "❌ ERROR: WP_PAGE_IDS is not set!"
            exit 1
          fi
          
          # 認証情報の確認（デバッグ用）
          if [ -n "${WP_JWT:-}" ]; then
            echo "🔐 JWT token available"
          elif [ -n "${WP_BASIC_USER:-}" ] && [ -n "${WP_BASIC_PASS:-}" ]; then
            echo "🔐 Basic auth available"
          else
            echo "🔓 No auth credentials (public access only)"
          fi
          
          # WordPress URLの接続テスト
          echo "🔍 Testing WordPress connection..."
          if curl -s -f "$WP_URL" > /dev/null; then
            echo "✅ WordPress site is accessible"
          else
            echo "❌ WARNING: WordPress site may not be accessible"
          fi
          
          # REST API認証テスト
          if [ -n "${WP_JWT:-}" ]; then
            echo "🔐 Testing JWT authentication..."
            REST_URL="${WP_URL%/}/wp-json/wp/v2/users/me"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $WP_JWT" "$REST_URL")
            echo "📊 JWT auth test result: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ JWT authentication working"
            else
              echo "❌ JWT authentication failed"
            fi
          elif [ -n "${WP_BASIC_USER:-}" ] && [ -n "${WP_BASIC_PASS:-}" ]; then
            echo "🔐 Testing Basic authentication..."
            REST_URL="${WP_URL%/}/wp-json/wp/v2/users/me"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$WP_BASIC_USER:$WP_BASIC_PASS" "$REST_URL")
            echo "📊 Basic auth test result: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Basic authentication working"
            else
              echo "❌ Basic authentication failed"
            fi
          else
            echo "🔓 No authentication credentials to test"
          fi
          
          test -f scripts/fetch-acf.js
          
          # 見開きモードでは隣接ページも取得
          FETCH_PAGE_IDS="$WP_PAGE_IDS"
          if [ "${SPREAD_MODE:-false}" = "true" ]; then
            echo "📖 Spread mode: expanding page IDs to include adjacent pages"
            
            # 簡単な方法：指定されたページIDに基づいて隣接ページIDを推測
            EXPANDED_IDS=""
            for page_id in $(echo "$WP_PAGE_IDS" | tr ',' ' '); do
              echo "🔍 Processing page ID: $page_id"
              
              # 現在のページIDを追加
              if [ -z "$EXPANDED_IDS" ]; then
                EXPANDED_IDS="$page_id"
              else
                EXPANDED_IDS="$EXPANDED_IDS,$page_id"
              fi
              
              # 隣接ページIDを推測（±1, ±2, ±3の範囲で検索）
              echo "📄 Adding potential adjacent pages for page $page_id..."
              for offset in -3 -2 -1 1 2 3; do
                adjacent_id=$((page_id + offset))
                if [ $adjacent_id -gt 0 ]; then
                  EXPANDED_IDS="$EXPANDED_IDS,$adjacent_id"
                  echo "   + Page ID $adjacent_id (offset: $offset)"
                fi
              done
            done
            
            # 重複を除去
            FETCH_PAGE_IDS=$(echo "$EXPANDED_IDS" | tr ',' '\n' | sort -u -n | tr '\n' ',' | sed 's/,$//')
            echo "📋 Expanded page IDs: $FETCH_PAGE_IDS"
            echo "📝 Note: fetch-acf.js will filter out non-existent pages"
          fi
          
          # fetch-acf.jsの実行（詳細ログ付き）
          echo "🚀 Running fetch-acf.js in workspace: $WORK_DIR"
          
          # ワークディレクトリの存在確認
          if [ ! -d "$WORK_DIR" ]; then
            echo "❌ ERROR: Workspace directory $WORK_DIR does not exist!"
            echo "🔍 Available directories:"
            ls -la
            echo "🔍 Environment variables:"
            env | grep -E "(WORK_DIR|OUT_DIR|DEPLOY_DIR)" || echo "No workspace env vars found"
            exit 1
          fi
          
          cd "$WORK_DIR"
          if node scripts/fetch-acf.js "$FETCH_PAGE_IDS"; then
            echo "✅ fetch-acf.js completed successfully"
          else
            echo "❌ fetch-acf.js failed with exit code $?"
            echo "🔍 This may cause dummy data fallback"
            exit 1
          fi
          
          echo "📄 Generated files:"
          ls -1 content-*.json id-slug-map.json

      - name: Verify content files
        run: |
          echo "📋 Content verification in: $WORK_DIR"
          cd "$WORK_DIR"
          ls -la content-*.json id-slug-map.json 2>/dev/null || echo "⚠️ Content files not found"
          
          # ダミーデータチェック
          if grep -q "Demo Booklet\|ダミーの本文" content-*.json 2>/dev/null; then
            echo "⚠️ WARNING: Dummy data detected!"
          else
            echo "✅ Real WordPress data confirmed"
          fi

      - name: Build PDFs
        run: |
          echo "🏗️ Building PDFs in: $WORK_DIR"
          cd "$WORK_DIR"
          
          # 見開きモードの確認とビルドコマンドの調整
          if [ "${SPREAD_MODE:-false}" = "true" ]; then
            echo "📖 Building in spread mode with suffix: ${OUTPUT_SUFFIX:-}"
            node scripts/build-batch.js --pdf --out out --spread --suffix "${OUTPUT_SUFFIX:-}"
          else
            echo "📄 Building in normal mode"
            node scripts/build-batch.js --pdf --out out
          fi

      - name: Verify PDFs generated
        run: |
          echo "📄 Generated PDFs in: $WORK_DIR"
          cd "$WORK_DIR"
          
          if ls out/booklet-*.pdf 1> /dev/null 2>&1; then
            echo "✅ PDFs generated successfully:"
            for pdf in out/booklet-*.pdf; do
              if [ -f "$pdf" ]; then
                filename=$(basename "$pdf")
                size=$(du -h "$pdf" | cut -f1)
                echo "  📄 $filename ($size)"
                
                # 見開きPDFかどうかを判定
                if [[ "$filename" == *"-spread.pdf" ]]; then
                  echo "    📖 → Spread PDF (見開きレイアウト)"
                else
                  echo "    📄 → Normal PDF (通常レイアウト)"
                fi
              fi
            done
            
            # 見開きモードの場合、追加情報を表示
            if [ "${SPREAD_MODE:-false}" = "true" ]; then
              echo ""
              echo "📖 Spread mode summary:"
              echo "  - Target page ID: ${WP_PAGE_IDS:-unknown}"
              echo "  - Output suffix: ${OUTPUT_SUFFIX:--spread}"
              echo "  - Layout: A3 landscape with left/right pages"
            fi
          else
            echo "❌ No PDFs generated"
            exit 1
          fi

      - name: Normalize filename to page ID (optional)
        if: ${{ env.TARGET_SLUG != '' }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          ID="${TARGET_SLUG}"
          
          # 見開きモードの場合はサフィックスを追加
          if [ "${SPREAD_MODE:-false}" = "true" ] && [ -n "${OUTPUT_SUFFIX:-}" ]; then
            TARGET_FILE="out/booklet-${ID}${OUTPUT_SUFFIX}.pdf"
            echo "📖 Target file for spread mode: ${TARGET_FILE}"
          else
            TARGET_FILE="out/booklet-${ID}.pdf"
            echo "📄 Target file for normal mode: ${TARGET_FILE}"
          fi
          
          # 生成されたPDFファイルを探す
          FIRST=$(ls -1 out/booklet-*.pdf 2>/dev/null | head -n1 || true)
          if [ -n "${FIRST}" ]; then
            # 同じファイル名でない場合のみコピー（上書き）
            if [ "${FIRST}" != "${TARGET_FILE}" ]; then
              cp "${FIRST}" "${TARGET_FILE}"
              echo "📄 Copied ${FIRST} to ${TARGET_FILE}"
            else
              echo "✅ File already has correct name: ${TARGET_FILE}"
            fi
          else
            echo "⚠️ No PDF found to normalize."
          fi

      - name: Stage PDFs for FTP upload
        run: |
          cd "$WORK_DIR"
          mkdir -p deploy
          if ls out/booklet-*.pdf 1> /dev/null 2>&1; then
            cp out/booklet-*.pdf deploy/
            echo "✅ PDFs staged for upload"
          else
            echo "⚠️ No PDFs to upload"
          fi

      - name: Set FTP target directory
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        run: |
          set -euo pipefail
          # FTP_DESTINATION_PATHが設定されていない場合はデフォルトを使用
          if [ -n "${FTP_DESTINATION_PATH:-}" ]; then
            dest="${FTP_DESTINATION_PATH%/}/"
          else
            dest="kazumanishiwaki.net/public_html/ks/wp-content/uploads/pdf-booklet/"
            echo "⚠️ FTP_DESTINATION_PATH not set, using default: $dest"
          fi
          echo "FTP_TARGET_DIR=$dest" >> "$GITHUB_ENV"
          echo "🎯 FTP target directory: $dest"



      - name: Upload PDFs to WordPress via FTP (individual files)
        id: ftp_upload
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          
          # 生成されたPDFファイルを個別にアップロード
          if ls deploy/booklet-*.pdf 1> /dev/null 2>&1; then
            echo "📤 Uploading individual PDF files to prevent deletion of existing files"
            
            # FTPコマンドでの個別ファイルアップロード
            for pdf_file in deploy/booklet-*.pdf; do
              if [ -f "$pdf_file" ]; then
                filename=$(basename "$pdf_file")
                echo "📤 Uploading: $filename"
                
                # FTPスクリプトファイルを作成
                echo "user $FTP_USERNAME $FTP_PASSWORD" > ftp_script.txt
                echo "binary" >> ftp_script.txt
                echo "cd $FTP_TARGET_DIR" >> ftp_script.txt
                echo "put $pdf_file $filename" >> ftp_script.txt
                echo "quit" >> ftp_script.txt
                
                # FTPコマンドを実行
                if ftp -n "$FTP_SERVER" < ftp_script.txt; then
                  echo "✅ Successfully uploaded: $filename"
                else
                  echo "❌ Failed to upload: $filename"
                fi
                
                # 一時ファイルを削除
                rm -f ftp_script.txt
              fi
            done
          else
            echo "⚠️ No PDF files to upload"
          fi


      - name: Verify public URL (optional)
        if: ${{ env.WP_URL != '' && env.TARGET_SLUG != '' }}
        run: |
          set -euo pipefail
          
          # 見開きモードの場合はサフィックスを追加
          if [ "${SPREAD_MODE:-false}" = "true" ] && [ -n "${OUTPUT_SUFFIX:-}" ]; then
            URL="${WP_URL%/}/wp-content/uploads/pdf-booklet/booklet-${TARGET_SLUG}${OUTPUT_SUFFIX}.pdf"
            echo "🔍 Checking spread PDF public URL: $URL"
          else
            URL="${WP_URL%/}/wp-content/uploads/pdf-booklet/booklet-${TARGET_SLUG}.pdf"
            echo "🔍 Checking normal PDF public URL: $URL"
          fi
          
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "📡 HTTP response: $code"
          if [ "$code" = "200" ]; then
            echo "✅ PDF is publicly accessible"
          else
            echo "⚠️ PDF not accessible (HTTP $code)"
          fi

      - name: Upload PDFs (artifact)
        if: ${{ hashFiles('work-*/out/booklet-*.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pdf-booklets-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}/out/booklet-*.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Report if no PDFs generated
        if: ${{ hashFiles('work-*/out/booklet-*.pdf') == '' }}
        run: echo "⚠️ No PDF files were generated"

      - name: Notify WordPress (webhook) - optional
        if: ${{ env.WEBHOOK != '' }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          echo "📣 Sending webhook notification..."
          # Collect files from out/ but do not fail if none exist
          FILES=$((ls -1 out/booklet-*.pdf 2>/dev/null || true) | jq -R . | jq -s .)
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"run_id\":\"$RUN_ID\",\"files\":$FILES}"
          echo "✅ Webhook sent to: $WEBHOOK"

      - name: Cleanup workspace
        if: always()
        run: |
          echo "🧹 Cleaning up workspace: $WORK_DIR"
          if [ -d "$WORK_DIR" ]; then
            rm -rf "$WORK_DIR"
            echo "✅ Workspace cleaned up"
          else
            echo "ℹ️ No workspace to clean"
          fi